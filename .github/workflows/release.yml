name: Release

on:
  push:
    branches: [master]
    paths: [app/build.gradle.kts]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Release if the version is new
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*versionName *= *"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          [ -z "$VERSION" ] && { echo "::error::No versionName in app/build.gradle.kts"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" > /dev/null 2>&1 \
            && { echo "v$VERSION already released, skipping"; exit 0; }
          [ -z "$KEYSTORE_BASE64" ] && { echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          chmod +x gradlew
          ./gradlew assembleRelease
          APK="MoexAnalyzer-v$VERSION.apk"
          cp app/build/outputs/apk/release/*-release.apk "$APK"
          gh release create "v$VERSION" "$APK" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes